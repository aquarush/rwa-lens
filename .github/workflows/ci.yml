name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # fail the build if any tracked file contains a key or a .env file
      - run: npm run check:secrets
      - run: npm run typecheck
      # tests force mock mode and a temp data dir: no API keys or credits needed
      - run: npm test
      - run: npm run build
      # bundles the Cloudflare worker with no Node built-ins allowed
      - run: npm run build:cf
